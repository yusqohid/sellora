{{ define "content" }}
<div class="login-wrapper">
  <!-- Glowing background shapes for modern visual appearance -->
  <div class="login-bg-shape login-bg-shape-1"></div>
  <div class="login-bg-shape login-bg-shape-2"></div>

  <!-- Main centered register card -->
  <div class="login-card">
    <!-- Brand Identity with Spark Asterisk -->
    <a href="/" class="login-brand text-decoration-none">
      <span class="brand-icon-spark" style="width: 32px; height: 32px; padding: 4px;">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(50,50)">
            <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" />
            <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" transform="rotate(60)" />
            <rect x="-7" y="-45" width="14" height="90" rx="7" ry="7" fill="#B4F105" transform="rotate(120)" />
          </g>
        </svg>
      </span>
      <span>Sellora</span>
    </a>

    <p class="login-subtitle">Create New Account</p>

    {{ if .Error }}
    <div class="alert alert-danger d-flex align-items-center gap-2 rounded-3 py-2 px-3 small mb-4" role="alert">
      <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
      <div>{{ .Error }}</div>
    </div>
    {{ end }}

    <form method="POST" action="/register">
      {{ if .CSRFToken }}
      <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
      {{ end }}

      <!-- Full Name Input Group -->
      <div class="login-form-group mb-3">
        <label for="name" class="login-form-label">Full Name</label>
        <div class="login-input-group">
          <i class="bi bi-person input-icon"></i>
          <input 
            type="text" 
            id="name" 
            name="name" 
            value="{{ .Name }}" 
            required 
            autocomplete="name"
            placeholder="Full Name" 
            class="login-input"
          >
        </div>
      </div>

      <!-- Email Input Group -->
      <div class="login-form-group mb-3">
        <label for="email" class="login-form-label">Email Address</label>
        <div class="login-input-group">
          <i class="bi bi-envelope input-icon"></i>
          <input 
            type="email" 
            id="email" 
            name="email" 
            value="{{ .Email }}" 
            required 
            autocomplete="email"
            placeholder="name@email.com" 
            class="login-input"
          >
        </div>
      </div>

      <!-- Password Input Group -->
      <div class="login-form-group mb-3">
        <label for="password" class="login-form-label">Password</label>
        <div class="login-input-group">
          <i class="bi bi-shield-lock input-icon"></i>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            minlength="8"
            autocomplete="new-password"
            placeholder="Minimum 8 characters" 
            class="login-input login-input-password"
          >
        </div>
      </div>

      <!-- Confirm Password Input Group -->
      <div class="login-form-group mb-4">
        <label for="password_confirm" class="login-form-label">Confirm Password</label>
        <div class="login-input-group">
          <i class="bi bi-shield-check input-icon"></i>
          <input 
            type="password" 
            id="password_confirm" 
            name="password_confirm" 
            required 
            minlength="8"
            autocomplete="new-password"
            placeholder="Repeat password" 
            class="login-input login-input-password"
          >
        </div>
      </div>

      <button type="submit" class="btn-login">
        <span>Create Account</span>
        <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="pt-4 border-top text-center text-muted small mt-4">
      Already have an account? 
      <a href="/login" class="text-dark fw-bold text-decoration-none ms-1">Sign In</a>
    </div>
  </div>
</div>
{{ end }}
